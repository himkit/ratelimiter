name: Refresh pkg.go.dev

on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  fetch:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release on pkg.go.dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          module=$(sed -n 's/^module //p' go.mod)
          test -n "$module"

          latest_tag=$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/releases/latest" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])'
          )

          if [ "$latest_tag" != "$VERSION" ]; then
            echo "$VERSION is not the latest release; latest is $latest_tag"
            exit 0
          fi

          curl -fsSL "https://proxy.golang.org/${module}/@v/${VERSION}.info" >/dev/null

          status=$(
            curl -sS -o pkgsite-fetch.txt -w "%{http_code}" \
              -X POST "https://pkg.go.dev/fetch/${module}@${VERSION}"
          )
          cat pkgsite-fetch.txt

          case "$status" in
            200|202|408) ;;
            *) echo "pkg.go.dev fetch failed: HTTP $status"; exit 1 ;;
          esac
